<html>
    <body>
        <script>
            a = parseFloat( prompt("Digite um numero: "));
            b = parseFloat( prompt("Digite outro numero: "));

            if( a > b) {
                document.write("A e maior que B ", a , " > ", b)
            }else{
                document.write("B e maior que A ", b,' > ' ,a)
            }

        </script>
    </body>
</html>
